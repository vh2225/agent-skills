name: leak-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tests
        run: |
          python3 -m unittest discover -s tests
          bash tools/agent-memory-sync/tests/test_sync.sh
      # The private denylist is deliberately NOT given to CI: it is the very data this
      # repo protects. Private terms are enforced by the local pre-commit and pre-push hooks.
      - name: Generic rules over the full history (blobs, paths, commit metadata)
        run: python3 scripts/leak_guard.py --history
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact -c /repo/.gitleaks.toml /repo
      - name: Commit emails are noreply
        run: |
          bad=$(git log --all --format='%ae%n%ce' | sort -u | grep -v -E '@users\.noreply\.github\.com$|^noreply@(github|anthropic)\.com$' || true)
          if [ -n "$bad" ]; then echo "non-noreply commit email found"; exit 1; fi
