name: leak-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Generic rules plus private denylist (from a repository secret)
        env:
          LEAK_GUARD_DENYLIST: ${{ secrets.LEAK_GUARD_DENYLIST }}
        run: |
          if [ -n "$LEAK_GUARD_DENYLIST" ]; then
            python3 scripts/leak_guard.py --require-denylist --all
          else
            unset LEAK_GUARD_DENYLIST
            python3 scripts/leak_guard.py --all
          fi
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact -c /repo/.gitleaks.toml /repo
      - name: Commit emails are noreply
        run: |
          bad=$(git log --format='%ae%n%ce' | sort -u | grep -v '@users.noreply.github.com$' | grep -v '^noreply@anthropic.com$' | grep -v '^noreply@github.com$' || true)
          if [ -n "$bad" ]; then echo "non-noreply commit email found"; exit 1; fi
